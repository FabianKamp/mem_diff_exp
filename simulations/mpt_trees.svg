<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <style>
      .tree-label { font-family: sans-serif; font-size: 12px; fill: #666; }
      .prob-label { font-family: sans-serif; font-size: 13px; fill: #333; font-weight: 600; }
      .prob-small { font-family: sans-serif; font-size: 11px; fill: #555; }
      .prob-tiny { font-family: sans-serif; font-size: 10px; fill: #777; }
      .outcome-label { font-family: sans-serif; font-size: 13px; fill: white; font-weight: 600; }
      .outcome-small { font-family: sans-serif; font-size: 11px; fill: white; font-weight: 600; }
      .outcome-tiny { font-family: sans-serif; font-size: 9px; fill: white; font-weight: 600; }
      .tree-legend { font-family: sans-serif; font-size: 11px; fill: #666; }
      .title { font-family: sans-serif; font-size: 16px; fill: #333; font-weight: 600; }
      .formula { font-family: 'Courier New', monospace; font-size: 12px; fill: #555; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="white"/>

  <!-- ==================== Condition S Tree ==================== -->
  <g transform="translate(20, 30)">
    <!-- Title -->
    <text x="150" y="0" class="title" text-anchor="middle" fill="steelblue">Condition: S (semantic only)</text>

    <!-- Root -->
    <circle cx="40" cy="100" r="10" fill="steelblue"/>
    <text x="15" y="80" class="tree-label">item</text>

    <!-- Branch: ms -> hit -->
    <line x1="50" y1="93" x2="160" y2="45" stroke="steelblue" stroke-width="2.5"/>
    <text x="85" y="58" class="prob-label">ms</text>
    <rect x="165" y="28" width="60" height="35" rx="5" fill="#4CAF50"/>
    <text x="195" y="52" class="outcome-label" text-anchor="middle">HIT</text>

    <!-- Branch: 1-ms -> guess -->
    <line x1="50" y1="107" x2="160" y2="155" stroke="steelblue" stroke-width="2.5"/>
    <text x="75" y="145" class="prob-label">1-ms</text>
    <circle cx="170" cy="155" r="8" fill="#999"/>
    <text x="165" y="185" class="tree-label">guess</text>

    <!-- Guess branches -->
    <line x1="178" y1="150" x2="260" y2="115" stroke="#999" stroke-width="2"/>
    <text x="210" y="125" class="prob-small">0.5</text>
    <rect x="265" y="98" width="50" height="30" rx="5" fill="#4CAF50"/>
    <text x="290" y="118" class="outcome-small" text-anchor="middle">HIT</text>

    <line x1="178" y1="160" x2="260" y2="195" stroke="#999" stroke-width="2"/>
    <text x="210" y="190" class="prob-small">0.5</text>
    <rect x="265" y="180" width="50" height="30" rx="5" fill="#f44336"/>
    <text x="290" y="200" class="outcome-small" text-anchor="middle">MISS</text>

    <!-- Formula -->
    <text x="150" y="240" class="formula" text-anchor="middle">P(hit) = ms + (1-ms) x 0.5</text>
  </g>

  <!-- ==================== Condition V Tree ==================== -->
  <g transform="translate(370, 30)">
    <!-- Title -->
    <text x="150" y="0" class="title" text-anchor="middle" fill="coral">Condition: V (visual only)</text>

    <!-- Root -->
    <circle cx="40" cy="100" r="10" fill="coral"/>
    <text x="15" y="80" class="tree-label">item</text>

    <!-- Branch: mv -> hit -->
    <line x1="50" y1="93" x2="160" y2="45" stroke="coral" stroke-width="2.5"/>
    <text x="85" y="58" class="prob-label">mv</text>
    <rect x="165" y="28" width="60" height="35" rx="5" fill="#4CAF50"/>
    <text x="195" y="52" class="outcome-label" text-anchor="middle">HIT</text>

    <!-- Branch: 1-mv -> guess -->
    <line x1="50" y1="107" x2="160" y2="155" stroke="coral" stroke-width="2.5"/>
    <text x="70" y="145" class="prob-label">1-mv</text>
    <circle cx="170" cy="155" r="8" fill="#999"/>
    <text x="165" y="185" class="tree-label">guess</text>

    <!-- Guess branches -->
    <line x1="178" y1="150" x2="260" y2="115" stroke="#999" stroke-width="2"/>
    <text x="210" y="125" class="prob-small">0.5</text>
    <rect x="265" y="98" width="50" height="30" rx="5" fill="#4CAF50"/>
    <text x="290" y="118" class="outcome-small" text-anchor="middle">HIT</text>

    <line x1="178" y1="160" x2="260" y2="195" stroke="#999" stroke-width="2"/>
    <text x="210" y="190" class="prob-small">0.5</text>
    <rect x="265" y="180" width="50" height="30" rx="5" fill="#f44336"/>
    <text x="290" y="200" class="outcome-small" text-anchor="middle">MISS</text>

    <!-- Formula -->
    <text x="150" y="240" class="formula" text-anchor="middle">P(hit) = mv + (1-mv) x 0.5</text>
  </g>

  <!-- ==================== Condition SV Tree ==================== -->
  <g transform="translate(100, 340)">
    <!-- Title -->
    <text x="300" y="0" class="title" text-anchor="middle" fill="seagreen">Condition: SV (semantic + visual)</text>

    <!-- Root -->
    <circle cx="30" cy="130" r="10" fill="seagreen"/>
    <text x="5" y="110" class="tree-label">item</text>

    <!-- Branch: ms (semantic memory) -->
    <line x1="40" y1="122" x2="120" y2="60" stroke="seagreen" stroke-width="2.5"/>
    <text x="60" y="80" class="prob-label">ms</text>
    <circle cx="130" cy="60" r="8" fill="steelblue"/>

    <!-- ms -> (1-mv) -> HIT -->
    <line x1="138" y1="55" x2="220" y2="25" stroke="steelblue" stroke-width="2.5"/>
    <text x="160" y="30" class="prob-label">1-mv</text>
    <rect x="225" y="8" width="55" height="30" rx="5" fill="#4CAF50"/>
    <text x="252" y="28" class="outcome-small" text-anchor="middle">HIT</text>

    <!-- ms -> mv -> binding -->
    <line x1="138" y1="65" x2="220" y2="90" stroke="coral" stroke-width="2.5"/>
    <text x="165" y="88" class="prob-label">mv</text>
    <circle cx="230" cy="90" r="6" fill="#666"/>

    <!-- binding -> b -> HIT -->
    <line x1="236" y1="86" x2="310" y2="55" stroke="#666" stroke-width="2"/>
    <text x="265" y="62" class="prob-small">b</text>
    <rect x="315" y="40" width="50" height="28" rx="4" fill="#4CAF50"/>
    <text x="340" y="59" class="outcome-small" text-anchor="middle">HIT</text>

    <!-- binding -> 1-b -> MISS -->
    <line x1="236" y1="94" x2="310" y2="120" stroke="#666" stroke-width="2"/>
    <text x="255" y="118" class="prob-small">1-b</text>
    <rect x="315" y="106" width="50" height="28" rx="4" fill="#f44336"/>
    <text x="340" y="125" class="outcome-small" text-anchor="middle">MISS</text>

    <!-- Branch: 1-ms (no semantic memory) -->
    <line x1="40" y1="138" x2="120" y2="200" stroke="seagreen" stroke-width="2.5"/>
    <text x="55" y="185" class="prob-label">1-ms</text>
    <circle cx="130" cy="200" r="8" fill="#999"/>

    <!-- (1-ms) -> (1-mv) -> guess -->
    <line x1="138" y1="195" x2="220" y2="170" stroke="#999" stroke-width="2"/>
    <text x="155" y="175" class="prob-small">1-mv</text>
    <circle cx="230" cy="170" r="5" fill="#bbb"/>

    <!-- guess -> 0.5 -> HIT -->
    <line x1="235" y1="167" x2="310" y2="145" stroke="#bbb" stroke-width="1.5"/>
    <text x="265" y="148" class="prob-tiny">0.5</text>
    <rect x="315" y="132" width="45" height="24" rx="4" fill="#4CAF50"/>
    <text x="337" y="149" class="outcome-tiny" text-anchor="middle">HIT</text>

    <!-- guess -> 0.5 -> MISS -->
    <line x1="235" y1="173" x2="310" y2="195" stroke="#bbb" stroke-width="1.5"/>
    <text x="265" y="198" class="prob-tiny">0.5</text>
    <rect x="315" y="182" width="45" height="24" rx="4" fill="#f44336"/>
    <text x="337" y="199" class="outcome-tiny" text-anchor="middle">MISS</text>

    <!-- (1-ms) -> mv -> MISS (visual without semantic = rejection) -->
    <line x1="138" y1="205" x2="220" y2="240" stroke="#999" stroke-width="2"/>
    <text x="160" y="238" class="prob-small">mv</text>
    <rect x="225" y="225" width="50" height="28" rx="4" fill="#f44336"/>
    <text x="250" y="244" class="outcome-small" text-anchor="middle">MISS</text>

    <!-- Legend -->
    <g transform="translate(420, 30)">
      <circle cx="0" cy="0" r="5" fill="steelblue"/>
      <text x="12" y="4" class="tree-legend">Semantic memory</text>

      <circle cx="0" cy="25" r="5" fill="coral"/>
      <text x="12" y="29" class="tree-legend">Visual memory</text>

      <circle cx="0" cy="50" r="5" fill="#666"/>
      <text x="12" y="54" class="tree-legend">Bias decision</text>

      <circle cx="0" cy="75" r="5" fill="#999"/>
      <text x="12" y="79" class="tree-legend">Guessing</text>
    </g>

    <!-- Formula -->
    <text x="300" y="290" class="formula" text-anchor="middle">P(hit) = ms(1-mv) + ms x mv x b + (1-ms)(1-mv) x 0.5</text>
  </g>
</svg>
